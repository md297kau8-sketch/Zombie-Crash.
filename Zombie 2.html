      align-items: center;
      justify-content: center;
      cursor: pointer;

    .toast-alert {

    .toast-alert.show {
      opacity: 1;
      transform: translateX(-50%) translateY(5px);
    }
  </style>

    function initUserDatabaseSync() {
      const urlParams = new URLSearchParams(window.location.search);
      let phoneFound = urlParams.get('phone') || urlParams.get('user') || urlParams.get('uid');

      if (!phoneFound) {
        try {
          if (window.parent && window.parent.user && window.parent.user.phone) {
            phoneFound = window.parent.user.phone;
          }
        } catch(e) {}
      }

      if (!phoneFound) {
        try {
          phoneFound = localStorage.getItem('bd99_user');
        } catch(e) {}
      }

      if (phoneFound) {
        bindUserAccount(phoneFound);
      } else {
        database.ref('users').limitToLast(1).once('value', (snap) => {
          if (snap.exists()) {
            const data = snap.val();
            const lastPhone = Object.keys(data)[0];
            if (lastPhone) bindUserAccount(lastPhone);
          }
        });
      }
    }

    function bindUserAccount(phone) {
      activePhone = phone;
      try { localStorage.setItem('bd99_user', phone); } catch(e) {}

      database.ref('users/' + phone + '/balance').on('value', (snapshot) => {
        if (snapshot.exists() && snapshot.val() !== null) {
          virtualBalance = parseFloat(snapshot.val()) || 0;

      virtualBalance = parseFloat((virtualBalance - amount).toFixed(2));
      updateBalanceUI();

      if (activePhone) {
        database.ref('users/' + activePhone + '/balance').transaction((curr) => {
          let val = parseFloat(curr);
          if (isNaN(val)) return 0;
          return Math.max(0, parseFloat((val - amount).toFixed(2)));
        });

        database.ref('users/' + activePhone + '/wager_left').transaction((curr) => {
          let left = parseFloat(curr || 0) - amount;

    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
      }
      beep(freq = 600, duration = 0.08, type = "sine") {
        if (this.muted) return;
        this.init();
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch (e) {}
      }
      tick() { this.beep(920, 0.04, "triangle"); }
      jumpLaunch() {
        if (this.muted) return;
        this.init();
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(160, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(750, this.ctx.currentTime + 0.45);
          gain.gain.setValueAtTime(0.22, this.ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.5);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.5);
        } catch(e) {}
      }
      claim() {
        if (this.muted) return;
        this.init();
        [523, 659, 783, 1046, 1318].forEach((f, i) => {
          setTimeout(() => this.beep(f, 0.12, "sine"), i * 45);
        });
      }
      crash() {
        if (this.muted) return;
        this.init();
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(160, this.ctx.currentTime);
          osc.frequency.linearRampToValueAtTime(25, this.ctx.currentTime + 0.6);
          gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.6);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.6);
        } catch(e) {}
      }
      toggle() {
        this.muted = !this.muted;
        return this.muted;
      }
    }

    const particles = [];
    class Particle {
      constructor(x, y, vx, vy, color, size, maxLife) {
        this.x = x; this.y = y; this.vx = vx; this.vy = vy;
        this.color = color; this.size = size; this.life = 0; this.maxLife = maxLife;
      }
      update() {
        this.x += this.vx; this.y += this.vy; this.life++;
        this.size = Math.max(0, this.size * 0.94);
      }
      draw(c) {
        const alpha = 1 - this.life / this.maxLife;
        if (alpha <= 0) return;
        c.save();
        c.globalAlpha = alpha;
        c.fillStyle = this.color;
        c.beginPath();
        c.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        c.fill();
        c.restore();
      }
    }

      const scrollSpeed = (gameState === STATES.FLYING) ? (2.0 + Math.min(6, currentMultiplier * 0.45)) : 0.3;

      ctx.save();
      ctx.translate(-sceneOffset, 0);
      for (let pass = 0; pass < 3; pass++) {
        const shift = pass * 400;
        skyline.forEach(b => {
          const bx = b.x + shift;
          const by = ch - b.h;
          ctx.fillStyle = "#050917";
          ctx.fillRect(bx, by, b.w, b.h);
          if (b.lit) {

      }
      ctx.restore();

      const roofX = 0;

      ctx.save();
      const roofGrad = ctx.createLinearGradient(0, roofY, 0, ch);

      handTwitchAngle = Math.sin(timestamp * 0.007) * 0.18 + Math.cos(timestamp * 0.015) * 0.08;

      const targetFlightX = cw * 0.58;

      if (gameState === STATES.COUNTDOWN) {

      flightLoop();
    }

    function flightLoop() {
      if (gameState !== STATES.FLYING) return;

      const elapsedSec = (performance.now() - flightStartTime) / 1000;
      currentMultiplier = 1.00 + (elapsedSec * 0.08) + Math.pow(elapsedSec * 0.16, 2.05);

      playerSlots.forEach(slot => {
        if (slot.activeCurrentRound && !slot.claimed && slot.autoClaim && currentMultiplier >= slot.targetMultiplier) {
          claimSlotReward(slot, slot.targetMultiplier);
        }
      });

      currentRoundParticipants.forEach(p => {
        if (!p.isPlayer && !p.claimed && currentMultiplier >= p.target) {
          p.claimed = true;
          p.cashAt = currentMultiplier;
        }
      });

      sortAndRenderLiveTable();

      if (currentMultiplier >= crashPoint) {
        triggerCrash(crashPoint);
      } else {
        multiplierLabel.innerText = "x" + currentMultiplier.toFixed(2);
        playerSlots.forEach(slot => {
          if (slot.activeCurrentRound && !slot.claimed) updateSlotUI(slot);
        });
        requestAnimationFrame(flightLoop);
      }
    }

    function triggerCrash(finalScore) {
      gameState = STATES.CRASHED;
      sound.crash();
      currentMultiplier = finalScore;
      multiplierLabel.innerText = "x" + finalScore.toFixed(2);
      multiplierLabel.classList.add("crashed");

      playerSlots.forEach(slot => {
        if (slot.activeCurrentRound && !slot.claimed) {
          slot.activeCurrentRound = false;
          recordRun(slot.points, 0, finalScore, false);
          updateSlotUI(slot);
        }
      });

      addHistoryPill(finalScore);
      sortAndRenderLiveTable();

      setTimeout(() => {
        startSevenSecondCountdown();
      }, 2900);
    }

    function claimSlotReward(slot, multiplierAchieved) {
      if (!slot.activeCurrentRound || slot.claimed) return;
      slot.claimed = true;
      slot.claimMultiplier = multiplierAchieved;
      const reward = parseFloat((slot.points * multiplierAchieved).toFixed(2));
      
      // ব্যালেন্স যোগ (FD44 ও Zombie Crash একসাথে সিঙ্ক হবে)
      addRealBalance(reward);
      
      sound.claim();
      recordRun(slot.points, reward, multiplierAchieved, true);

      const pEntry = currentRoundParticipants.find(p => p.slotId === slot.id);
      if (pEntry) {
        pEntry.claimed = true;
        pEntry.cashAt = multiplierAchieved;
      }
      sortAndRenderLiveTable();
      updateSlotUI(slot);
    }

    function addHistoryPill(val) {
      const pill = document.createElement("span");
      pill.className = "history-pill";
      if (val < 1.8) pill.classList.add("pill-blue");
      else if (val < 3.0) pill.classList.add("pill-cyan");
      else if (val < 6.0) pill.classList.add("pill-purple");
      else pill.classList.add("pill-gold");

      pill.innerText = "x" + val.toFixed(2);
      const ribbon = document.getElementById("historyRibbon");
      ribbon.insertBefore(pill, ribbon.firstChild);
      if (ribbon.children.length > 18) ribbon.removeChild(ribbon.lastChild);
    }

    function initRoundParticipants() {
      currentRoundParticipants = mockNames.map(name => {
        return {
          name: name,
          avatar: name[0].toUpperCase(),
          points: [15, 40, 100, 250, 500, 1200][Math.floor(Math.random() * 6)],
          target: 1.18 + Math.random() * 4.8,
          claimed: false,
          cashAt: 0,
          isPlayer: false
        };
      });

      updateParticipantsList();
    }

    function updateParticipantsList() {
      currentRoundParticipants = currentRoundParticipants.filter(p => !p.isPlayer);

      playerSlots.forEach(slot => {
        if (slot.activeCurrentRound) {
          currentRoundParticipants.push({
            name: "YOU (Slot " + slot.id + ")",
            avatar: "★",
            points: slot.points,
            target: slot.targetMultiplier,
            claimed: slot.claimed,
            cashAt: slot.claimMultiplier || 0,
            isPlayer: true,
            slotId: slot.id
          });
        }
      });

      sortAndRenderLiveTable();
    }

    function sortAndRenderLiveTable() {
      currentRoundParticipants.sort((a, b) => b.points - a.points);
      renderTabs();
    }

    const balanceDisplay = document.getElementById("virtualBalanceDisplay");
    function updateBalanceUI() {
      balanceDisplay.innerText = virtualBalance.toFixed(2) + " ৳";
    }

    function setupSlotPanel(index) {
      const slot = playerSlots[index];
      const pNum = index + 1;

      const minusBtn = document.getElementById(`p${pNum}StepMinus`);
      const plusBtn = document.getElementById(`p${pNum}StepPlus`);
      const valInput = document.getElementById(`p${pNum}PointsVal`);
      const actionBtn = document.getElementById(`p${pNum}ActionBtn`);
      const autoModeCheck = document.getElementById(`autoModeCheck${pNum}`);
      const autoClaimCheck = document.getElementById(`autoClaimCheck${pNum}`);
      const targetScorePill = document.getElementById(`targetScoreDisplay${pNum}`);
      const deckPanel = document.getElementById(`deckPanel${pNum}`);

      function setVal(n) {
        slot.points = Math.max(5, Math.min(99999, parseInt(n) || 5));
        valInput.value = slot.points;
      }

      valInput.addEventListener("input", (e) => {
        let parsed = parseInt(e.target.value);
        if (isNaN(parsed)) parsed = 5;
        if (parsed > 99999) parsed = 99999;
        slot.points = parsed;
      });

      valInput.addEventListener("blur", (e) => {
        setVal(e.target.value);
      });

      minusBtn.onclick = () => {
        setVal(slot.points > 100 ? slot.points - 50 : slot.points - 5);
        sound.beep(420, 0.04);
      };

      plusBtn.onclick = () => {
        setVal(slot.points >= 100 ? slot.points + 50 : slot.points + 5);
        sound.beep(560, 0.04);
      };

      deckPanel.querySelectorAll(".quick-pill").forEach(pill => {
        pill.onclick = () => {
          setVal(parseInt(pill.dataset.val));
          sound.beep(650, 0.04);
        };
      });

      autoModeCheck.onchange = (e) => {
        slot.autoPilot = e.target.checked;
        if (slot.autoPilot) {
          showToast("Autopilot Enabled");
        }
      };

      autoClaimCheck.onchange = (e) => {
        slot.autoClaim = e.target.checked;
      };

      targetScorePill.onclick = () => {
        const targets = [1.50, 2.00, 2.80, 3.50, 5.00, 10.00];
        let idx = targets.indexOf(slot.targetMultiplier);
        slot.targetMultiplier = targets[(idx + 1) % targets.length];
        targetScorePill.innerText = "x" + slot.targetMultiplier.toFixed(2);
        sound.beep(850, 0.06);
      };

      actionBtn.onclick = () => {
        sound.init();
        setVal(valInput.value);

        if (gameState === STATES.COUNTDOWN) {
          if (slot.activeCurrentRound) {
            slot.activeCurrentRound = false;
            // রিফান্ড
            addRealBalance(slot.points);
          } else {
            if (virtualBalance >= slot.points) {
              // বেট কাটা
              deductRealBalance(slot.points);
              slot.activeCurrentRound = true;
            } else {
              showToast("Insufficient Balance!");
              return;
            }
          }
          updateParticipantsList();
        } 
        else if (gameState === STATES.FLYING || gameState === STATES.JUMPING) {
          if (slot.activeCurrentRound && !slot.claimed) {
            claimSlotReward(slot, currentMultiplier);
          } else if (slot.queuedNextRound) {
            slot.queuedNextRound = false;
            // রিফান্ড
            addRealBalance(slot.points);
          } else {
            if (virtualBalance >= slot.points) {
              // পরবর্তী রাউন্ডের জন্য বেট কাটা
              deductRealBalance(slot.points);
              slot.queuedNextRound = true;
            } else {
              showToast("Insufficient Balance!");
              return;
            }
          }
        }

        updateSlotUI(slot);
      };
    }

    function updateSlotUI(slot) {
      const pNum = slot.id;
      const actionBtn = document.getElementById(`p${pNum}ActionBtn`);
      const actionText = document.getElementById(`p${pNum}ActionText`);
      const actionSub = document.getElementById(`p${pNum}ActionSub`);

      actionBtn.className = "action-btn-main";

      if (gameState === STATES.FLYING || gameState === STATES.JUMPING) {
        if (slot.activeCurrentRound && !slot.claimed) {
          actionBtn.classList.add("claiming");
          const liveVal = Math.floor(slot.points * currentMultiplier);
          actionText.innerText = "CLAIM";
          actionSub.innerText = `${liveVal} ৳`;
        } else if (slot.claimed) {
          actionText.innerText = "CLAIMED";
          actionSub.innerText = `x${slot.claimMultiplier.toFixed(2)}`;
        } else if (slot.queuedNextRound) {
          actionBtn.classList.add("cancel");
          actionText.innerText = "WAITING";
          actionSub.innerText = "Next Round (Cancel)";
        } else {
          actionText.innerText = "START";
          actionSub.innerText = "Next Round";
        }
      } else {
        if (slot.activeCurrentRound) {
          actionBtn.classList.add("cancel");
          actionText.innerText = "READY";
          actionSub.innerText = "Cancel Bet";
        } else {
          actionText.innerText = "START";
          actionSub.innerText = "Bet on this round";
        }
      }
    }

    setupSlotPanel(0);
    setupSlotPanel(1);

    const deckPanel2 = document.getElementById("deckPanel2");
    const togglePanelBtn = document.getElementById("toggleSecondPanelBtn");
    const togglePanelText = document.getElementById("togglePanelText");
    let panel2Open = false;

    togglePanelBtn.onclick = () => {
      panel2Open = !panel2Open;
      deckPanel2.style.display = panel2Open ? "block" : "none";
      togglePanelText.innerText = panel2Open ? "Close Secondary Flight Slot" : "Add Secondary Flight Slot";
      sound.beep(600, 0.05);
    };

    document.getElementById("audioToggleBtn").onclick = () => {
      const isMuted = sound.toggle();
      document.getElementById("audioToggleBtn").style.opacity = isMuted ? "0.4" : "1";
    };

    document.getElementById("infoToggleBtn").onclick = () => {
      alert("RULES:\n• Manually place your bet during the 7s countdown.\n• Highest bets always top the Current Round list (#1).\n• Min Bet: 5 ৳ | Max Bet: 99,999 ৳.\n• 100% Synced with your FD44 platform balance.");
    };

    let currentTab = "tab-current";
    const tabContentArea = document.getElementById("tabContentArea");

    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentTab = btn.dataset.tab;
        renderTabs();
        sound.beep(750, 0.04);
      };
    });

    function recordRun(pts, earned, mult, won) {
      myRunsLog.unshift({
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
        points: pts,
        earned: earned,
        multiplier: mult.toFixed(2),
        won: won
      });
      if (myRunsLog.length > 25) myRunsLog.pop();
    }

    function renderTabs() {
      if (currentTab === "tab-current") renderLiveTab();
      if (currentTab === "tab-myruns") renderMyRunsTab();
      if (currentTab === "tab-leaders") renderLeaderboardTab();
    }

    function renderLiveTab() {
      let html = "";
      currentRoundParticipants.forEach((p, idx) => {
        const isCrashed = (gameState === STATES.CRASHED && !p.claimed);
        html += `
          <div class="live-list-item ${p.isPlayer ? 'player-highlight' : ''}">
            <div class="live-user">
              <span class="rank-pill">#${idx + 1}</span>
              <span class="user-avatar" style="${p.isPlayer ? 'background:#00e5ff;color:#040e24;' : ''}">${p.avatar}</span>
              <span style="${p.isPlayer ? 'color:#00f0ff;font-weight:800;' : ''}">${p.name}</span>
            </div>
            <div>${p.points} ৳</div>
            <div class="live-score ${p.claimed ? "won" : (isCrashed ? "out" : "")}">
              ${p.claimed ? "x" + p.cashAt.toFixed(2) : (isCrashed ? "Crashed" : "Flying...")}
            </div>
          </div>
        `;
      });
      tabContentArea.innerHTML = html;
    }

    function renderMyRunsTab() {
      if (myRunsLog.length === 0) {
        tabContentArea.innerHTML = `<div style="text-align:center; color:#5b7ab0; padding:20px; font-size:12px;">No flights recorded yet.</div>`;
        return;
      }
      let html = "";
      myRunsLog.forEach(run => {
        html += `
          <div class="live-list-item">
            <div style="color:#7899cd">${run.time}</div>
            <div>${run.points} ৳</div>
            <div class="live-score ${run.won ? "won" : "out"}">
              ${run.won ? "+" + run.earned + " (x" + run.multiplier + ")" : "0.00 ৳"}
            </div>
          </div>
        `;
      });
      tabContentArea.innerHTML = html;
    }

    function renderLeaderboardTab() {
      const topHighscores = [
        { rank: "1", name: "ApexZombie", score: "x42.80", pts: "185,000 ৳" },
        { rank: "2", name: "CyberGhoul", score: "x28.40", pts: "94,200 ৳" },
        { rank: "3", name: "NightStalker", score: "x19.10", pts: "62,500 ৳" },
        { rank: "4", name: "NeonPhantom", score: "x14.65", pts: "38,000 ৳" },
        { rank: "5", name: "SkyGlider", score: "x10.50", pts: "21,400 ৳" }
      ];
      let html = "";
      topHighscores.forEach(item => {
        html += `
          <div class="live-list-item">
            <div class="live-user">
              <span class="rank-pill" style="color:#ffd644">#${item.rank}</span>
              <span>${item.name}</span>
            </div>
            <div style="color:#00f0ff; font-weight:700;">${item.score}</div>
            <div class="live-score won">${item.pts}</div>
          </div>
        `;
      });
      tabContentArea.innerHTML = html;
    }

    window.addEventListener('DOMContentLoaded', () => {
      initUserDatabaseSync();
      startSevenSecondCountdown();
    });
  </script>
</body>
</html>
